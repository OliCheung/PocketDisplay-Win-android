name: a
on: workflow_dispatch
jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode keystore (if provided)
        if: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release-key.jks"
          echo "KEYSTORE_FILE=${{ github.workspace }}/release-key.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build APK (signed release if keystore provided, else debug)
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building signed release APK"
            ./gradlew assembleRelease --no-daemon --init-script init.gradle
          else
            echo "No keystore secret - building debug APK (unsigned, sideloadable)"
            ./gradlew assembleDebug --no-daemon --init-script init.gradle
          fi
      - name: Copy APK to dist
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/*/*.apk dist/PocketDisplay.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/PocketDisplay.apk
