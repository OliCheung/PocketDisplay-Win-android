name: w
on: workflow_dispatch
jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyyaml mss pywebview
      - name: Install FFmpeg (bundled into the exe)
        run: choco install ffmpeg -y
      - name: Add FFmpeg to PATH
        run: |
          echo "C:\ProgramData\chocolatey\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
      - name: Install ADB (platform-tools, bundled into the exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile "$env:RUNNER_TEMP\pt.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\pt.zip" -DestinationPath "$env:RUNNER_TEMP\pt" -Force
          "$env:RUNNER_TEMP\pt\platform-tools" | Out-File -Append -FilePath $env:GITHUB_PATH
      - name: Build
        run: python build_win.py
      - name: Package
        run: Compress-Archive -Path dist\* -DestinationPath dist\PocketDisplay-win.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/PocketDisplay-win.zip
