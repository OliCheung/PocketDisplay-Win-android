name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # Windows client + server (PyInstaller one-file builds, self-contained:
  # ffmpeg and adb are bundled into dist/bin so no PATH install is required)
  # --------------------------------------------------------------------------
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyyaml mss pywebview

      - name: Install FFmpeg (bundled into the exe)
        run: choco install ffmpeg -y

      - name: Add FFmpeg to PATH
        run: |
          echo "C:\ProgramData\chocolatey\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Install ADB (platform-tools, bundled into the exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile "$env:RUNNER_TEMP\pt.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\pt.zip" -DestinationPath "$env:RUNNER_TEMP\pt" -Force
          "$env:RUNNER_TEMP\pt\platform-tools" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Build
        run: python build_win.py

      - name: Package
        run: Compress-Archive -Path dist\* -DestinationPath dist\PocketDisplay-win.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/PocketDisplay-win.zip

  # --------------------------------------------------------------------------
  # Android APK
  # --------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Decode keystore (if provided)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release-key.jks"
          echo "KEYSTORE_FILE=${{ github.workspace }}/release-key.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK (signed release if keystore provided, else debug)
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building signed release APK"
            ./gradlew assembleRelease --no-daemon --init-script init.gradle
          else
            echo "No keystore secret - building debug APK (unsigned, sideloadable)"
            ./gradlew assembleDebug --no-daemon --init-script init.gradle
          fi

      - name: Copy APK to dist
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/*/*.apk dist/PocketDisplay.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/PocketDisplay.apk

  # --------------------------------------------------------------------------
  # Publish both artifacts to a GitHub Release
  # --------------------------------------------------------------------------
  publish:
    name: Publish GitHub release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-exe/PocketDisplay-win.zip
            artifacts/android-apk/PocketDisplay.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
